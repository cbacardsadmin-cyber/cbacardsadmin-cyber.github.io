name: Release daily pins
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - run: |
          git config user.name "cba-bot"
          git config user.email "cba-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Release pins $(date -u +%F)"
          git push
